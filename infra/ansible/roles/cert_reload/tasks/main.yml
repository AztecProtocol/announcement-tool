# THE CERTIFICATE RENEWAL HOOK — see the long comment in
# templates/cert-reload.sh.j2 for the full reasoning. Short version:
# Caddy renews announce.aztec.network's Let's Encrypt cert on its own,
# silently, around day 60 of a ~90-day cert. Postgres reads
# ssl_cert_file/ssl_key_file once at startup and does not watch them —
# it will keep serving the OLD cert until something tells it to reload,
# which for TLS material is SIGHUP (`pg_reload_conf()` / `docker compose
# kill -s HUP db`). Without this role, the deployment works for ~2
# months and then Postgres starts presenting an expired cert to every
# client enforcing verify-full (i.e. every client, per
# src/db/connect.ts) — total outage, discovered days after everyone
# has moved on to other work.
#
# MECHANISM CHOSEN: a daily cron comparing the Caddy-obtained cert's
# fingerprint to the one Postgres is currently serving, copying + SIGHUP
# on change. This is the brief's "least clever, easiest to reason about"
# option, chosen over:
#   - Caddy's on_demand/exec plugins: not present in the stock
#     `caddy:2-alpine` image used here (docker-compose.split.yml) —
#     would require a custom-built Caddy image just for this, adding a
#     second thing (image build pipeline) that can silently go stale.
#   - inotifywait watching Caddy's cert directory: adds a long-running
#     daemon (inotify-tools) whose own health now needs monitoring, to
#     solve a problem a once-a-day cron already solves adequately — a
#     renewed cert sitting unused for a few hours before the next cron
#     tick is not a real risk (Let's Encrypt certs are valid ~90 days;
#     Caddy renews at ~day 60; a same-day pickup window is enormously
#     inside that margin).
# A daily cron is one job, one log file, one exit code — easy to verify
# by hand and easy to alert on.
- name: Install the cert-reload script
  ansible.builtin.template:
    src: cert-reload.sh.j2
    dest: /usr/local/bin/announce-cert-reload.sh
    mode: "0755"

- name: Schedule the cert-reload check daily
  ansible.builtin.cron:
    name: "announce: reload postgres TLS material if caddy renewed"
    # 04:17, not midnight/on-the-hour: avoids piling onto whatever else
    # runs at round times (this host's own `backup` service runs at
    # 03:00 UTC inside its container, unrelated to host cron, but keeping
    # host cron jobs off round numbers is a cheap habit against
    # unrelated contention).
    minute: "17"
    hour: "4"
    job: /usr/local/bin/announce-cert-reload.sh
    user: root

# OBSERVABILITY: "a hook must be visible if it fails" (task brief). This
# role does not itself send alerts (no SMTP/webhook config lives in
# Ansible) — instead the script logs every run's outcome (no-op,
# reloaded, or FAILED) to syslog with a distinct tag, and this task
# installs a logrotate rule so that log survives more than a few days of
# `journalctl` retention on a small VM. An operator (or a future
# Prometheus node_exporter textfile collector, matching the pattern
# already used by aztec-observability) checks
# `journalctl -t announce-cert-reload --since -7d`, or greps
# /var/log/announce-cert-reload.log directly.
- name: Install logrotate rule for the cert-reload log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/announce-cert-reload
    mode: "0644"
    content: |
      /var/log/announce-cert-reload.log {
        weekly
        rotate 12
        compress
        missingok
        notifempty
      }

- name: Ensure the cert-reload log file exists
  ansible.builtin.file:
    path: /var/log/announce-cert-reload.log
    state: touch
    mode: "0644"
    access_time: preserve
    modification_time: preserve

# Run once immediately, not only on the daily schedule above. On a FIRST
# deploy, `db` boots with the throwaway self-signed placeholder cert
# generated by the "Generate a bootstrap placeholder TLS cert if none
# exists yet" task in roles/compose_up/tasks/main.yml (fix round 1: this
# used to be generated by `db`'s own custom entrypoint at container
# start, but that put a package-mirror network call in the container's
# critical boot path — moved to a host-side Ansible task instead; see
# that task's comment and docker-compose.split.yml's `db` comment for
# the full bootstrap chicken-and-egg reasoning) — this run replaces that
# placeholder with Caddy's real cert right away, rather than leaving
# Postgres on a placeholder for up to 24 hours until the cron's first
# tick. On every subsequent playbook run this is a safe no-op (the
# fingerprint already matches), so it is unconditional here too, same
# reasoning as compose_up's "Start / converge the stack" task.
- name: Run the cert-reload check now, not only on its daily schedule
  ansible.builtin.command: /usr/local/bin/announce-cert-reload.sh
  changed_when: true
  # This intentionally does NOT swallow a non-zero exit. If Caddy has not
  # obtained a certificate yet at all (e.g. very first run, before DNS for
  # announce.aztec.network points at this host), the script's own `fail`
  # path is the correct, loud outcome — surfacing it here in Ansible's own
  # output, on the very run that caused it, beats discovering it only via
  # syslog after the fact.
