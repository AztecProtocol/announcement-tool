# Syncs the repo onto the host and brings the stack up. Secrets
# (POSTGRES_PASSWORD, BACKUP_ENCRYPTION_KEY, ANNOUNCE_SIGNAL_SECRET, ...)
# are never generated or templated by this role — see the note on
# `stack_dir + /.env` below.
#
# Why every tracked file, not just the compose file and Caddyfile: `backup`
# and `signal-receive` in docker-compose.split.yml build their images from
# `context: ./repo` (relative to {{ stack_dir }}, the project directory
# `docker compose` is invoked from — see the "Start / converge the stack"
# task below) plus Dockerfile.backup / Dockerfile.signal-receive /
# scripts/backup.sh / scripts/signal-receive.sh, all of which live in the
# repo, not in infra/. Copying only the two infra files here would leave
# those `docker compose build` invocations with no build context on the
# host at all.
#
# Only files tracked by git are shipped. Untracked and ignored files on the
# control machine (`.env`, `*.tfvars`, `*.tfstate`, `inventory.yml`, ...)
# never reach the host, and the play stops if a tracked file has
# uncommitted changes, so the host gets exactly one commit, recorded in
# {{ stack_dir }}/repo/DEPLOYED_COMMIT.
- name: Create the stack directory
  ansible.builtin.file:
    path: "{{ stack_dir }}"
    state: directory
    mode: "0755"

# `{{ playbook_dir }}/../..` is the repo root (site.yml lives in
# infra/ansible/). The git commands run on the control machine
# (delegate_to: localhost, become: false: no sudo on the operator's
# machine).
- name: Find the repository root on the control machine
  ansible.builtin.set_fact:
    compose_up_repo_root: "{{ (playbook_dir ~ '/../..') | realpath }}"

- name: Look for uncommitted changes to tracked files
  ansible.builtin.command:
    argv: [git, -C, "{{ compose_up_repo_root }}", status, --porcelain, --untracked-files=no]
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  register: compose_up_git_status

- name: Stop if tracked files have uncommitted changes
  ansible.builtin.fail:
    msg: >-
      Deploy stopped: these tracked files have changes that are not
      committed: {{ compose_up_git_status.stdout_lines | join('; ') }}.
      The deploy ships the committed state of the repository only. Commit
      or discard the changes, then run the play again. To deploy the files
      as they are on disk anyway, add -e announce_allow_dirty_deploy=true;
      DEPLOYED_COMMIT on the host then records that the tree had local
      changes.
  when:
    - compose_up_git_status.stdout | length > 0
    - not (announce_allow_dirty_deploy | default(false) | bool)

- name: Read the commit being deployed
  ansible.builtin.command:
    argv: [git, -C, "{{ compose_up_repo_root }}", rev-parse, HEAD]
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  register: compose_up_git_head

- name: List the tracked files
  ansible.builtin.command:
    argv: [git, -C, "{{ compose_up_repo_root }}", -c, core.quotePath=false, ls-files]
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  register: compose_up_git_files

# Even with core.quotePath=false, git prints a path in double quotes when
# it holds a double quote, a backslash or a control character. The rsync
# filter below cannot express those paths exactly, so the play stops.
- name: Refuse tracked paths the rsync filter cannot express
  ansible.builtin.assert:
    that:
      - compose_up_git_files.stdout_lines | length > 0
      - compose_up_git_files.stdout_lines | select('match', '^"') | list | length == 0
    fail_msg: >-
      git ls-files returned no files, or a tracked path with a double
      quote, backslash or control character. Rename that file; the deploy
      cannot ship it exactly.
  run_once: true

- name: Create a temporary rsync filter file on the control machine
  ansible.builtin.tempfile:
    suffix: .rsync-filter
  delegate_to: localhost
  run_once: true
  become: false
  # Scratch file on the control machine, not a change to the host.
  changed_when: false
  register: compose_up_filter_file

# rsync, not copy + recursive, so re-runs are fast. The filter file holds
# one include line per tracked file and parent directory, then `- *`.
# `--delete-excluded` (with `delete: true`) removes from the host every file
# the filter does not include: files deleted in git, and untracked files an
# older version of this task copied (it shipped the whole working tree).
# Proven on 2026-11-04 that `--files-from=<list>` with `--delete`, with or
# without `-r`, deletes nothing, so it is not used here.
#
# The five excludes are a second layer: they also match nothing tracked
# today. The filter's first rule, `P /DEPLOYED_COMMIT`, protects the record
# written below from the deletion. Nothing outside {{ stack_dir }}/repo is
# touched; the secrets file {{ stack_dir }}/.env sits next to repo/, not in
# it.
#
# Notifies the "Restart caddy" handler on change — see
# roles/compose_up/handlers/main.yml.
- name: Ship the tracked files to the host
  block:
    - name: Write the tracked-files rsync filter
      ansible.builtin.template:
        src: tracked-files.rsync-filter.j2
        dest: "{{ compose_up_filter_file.path }}"
        mode: "0600"
      delegate_to: localhost
      run_once: true
      become: false
      # Scratch file on the control machine, not a change to the host.
      changed_when: false

    - name: Sync the repository to the host
      ansible.posix.synchronize:
        src: "{{ compose_up_repo_root }}/"
        dest: "{{ stack_dir }}/repo"
        delete: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=.next"
          - "--exclude=infra/dev/certs"
          - "--exclude=infra/terraform/.terraform"
          # A merge file, not --include-from: --include-from reads every
          # line as an include pattern, so the `P` (protect) rule in the
          # file would not work. `merge_` is rsync's spelling of
          # "merge " without a space; synchronize joins rsync_opts into one
          # command line without quoting them, hence also `quote`.
          - "--filter=merge_{{ compose_up_filter_file.path | quote }}"
          - "--delete-excluded"
      notify: Restart caddy
  always:
    - name: Remove the temporary rsync filter file
      ansible.builtin.file:
        path: "{{ compose_up_filter_file.path }}"
        state: absent
      delegate_to: localhost
      run_once: true
      become: false
      # Scratch file on the control machine, not a change to the host.
      changed_when: false

# Read on the host with `cat /opt/announce/repo/DEPLOYED_COMMIT`.
- name: Record the deployed commit on the host
  ansible.builtin.copy:
    dest: "{{ stack_dir }}/repo/DEPLOYED_COMMIT"
    mode: "0644"
    content: |
      commit: {{ compose_up_git_head.stdout }}
      uncommitted changes to tracked files: {{ 'yes (deployed with announce_allow_dirty_deploy=true)' if compose_up_git_status.stdout | length > 0 else 'no' }}

# Symlinks, not copies: `docker compose` resolves a relative build context
# (docker-compose.split.yml's `backup`/`signal-receive` use `./repo`)
# against the project directory it is invoked from, not against the
# directory the compose file itself lives in or points at through a
# symlink. Invocation is always `chdir: {{ stack_dir }}` (see "Start /
# converge the stack" below), so the project directory is {{ stack_dir }},
# and `./repo` must exist there as a real directory — which is exactly
# where the sync task above puts it. These two symlinks just give
# `docker compose` a stable, short invocation path
# (`cd {{ stack_dir }} && docker compose up`) without callers needing to
# know the synced tree's structure.
- name: Symlink the compose file to the expected location
  ansible.builtin.file:
    src: "{{ stack_dir }}/repo/infra/docker-compose.split.yml"
    dest: "{{ stack_dir }}/docker-compose.yml"
    state: link
    force: true

- name: Symlink the Caddyfile to the expected location
  ansible.builtin.file:
    src: "{{ stack_dir }}/repo/infra/Caddyfile.split"
    dest: "{{ stack_dir }}/Caddyfile.split"
    state: link
    force: true

# The .env file is deliberately not managed here.
#
# POSTGRES_PASSWORD, BACKUP_ENCRYPTION_KEY, BACKUP_S3_*, ANNOUNCE_DOMAIN,
# ANNOUNCE_SIGNAL_SECRET, SIGNAL_ACCOUNT, and ALERT_EMAIL_TO are all real
# secrets or deployment-specific values (see docker-compose.split.yml's
# `${VAR:?VAR must be set}` guards, which make compose refuse to start
# without them). Templating them from Ansible variables would mean they
# either live in group_vars/host_vars in this repo (git — never) or an
# Ansible Vault-encrypted file this role would need to decrypt on every
# run — extra machinery for a value that changes rarely and is set once
# per deployment.
#
# Instead: this task only asserts the file exists, with a clear failure
# message pointing at what to do, mirroring how docker-compose.split.yml's
# own `:?` guards fail — loud and immediate, not a silent empty default.
# The operator creates {{ stack_dir }}/.env by hand on first deploy (see
# infra/ansible/inventory.yml.example's header comment), the same way
# aztec-observability's GRAFANA_ADMIN_PASSWORD is generated once on the
# host and never touched by Ansible again.
- name: Confirm the environment file exists
  ansible.builtin.stat:
    path: "{{ stack_dir }}/.env"
  register: compose_up_env_file

- name: Fail if the environment file is missing
  ansible.builtin.fail:
    msg: >-
      {{ stack_dir }}/.env does not exist. Create it on the host before
      running this playbook (see infra/ansible/inventory.yml.example) with
      POSTGRES_PASSWORD, ANNOUNCE_DOMAIN, ANNOUNCE_SIGNAL_SECRET,
      BACKUP_ENCRYPTION_KEY, BACKUP_S3_BUCKET, BACKUP_S3_ACCESS_KEY_ID,
      BACKUP_S3_SECRET_ACCESS_KEY, and SIGNAL_ACCOUNT set. This role does
      not generate or template secrets — see the comment above this task.
  when: not compose_up_env_file.stat.exists

# Defense in depth: `volume_mount`'s task list
# ends with an explicit `meta: flush_handlers` specifically so Docker is
# already restarted onto {{ data_mount }}/docker before this role ever
# creates a container or volume — see the long comment there for the
# failure this prevents (every named volume silently created on the root
# disk instead of the durable mounted volume). This task does not trust
# that ordering silently; it verifies it, so a future edit that removes
# or reorders that flush fails loudly here instead of orphaning data
# again through the same door.
- name: Assert Docker's data-root is the mounted volume, not the root disk
  ansible.builtin.command: docker info --format '{{ '{{' }}.DockerRootDir{{ '}}' }}'
  changed_when: false
  register: compose_up_docker_root_dir

- name: Fail if Docker is not using the expected data-root
  ansible.builtin.fail:
    msg: >-
      Docker's data-root is "{{ compose_up_docker_root_dir.stdout }}", not
      the expected "{{ data_mount }}/docker". This means the daemon.json
      change in the volume_mount role has not taken effect yet (its
      handler didn't run, or ran against a different data_mount) — DO NOT
      proceed, or `docker compose up` below will create db-data and every
      other named volume on the root disk instead of the durable Hetzner
      volume. Investigate the volume_mount role's handler flush before
      re-running this playbook.
  when: compose_up_docker_root_dir.stdout != (data_mount + '/docker')

# Replaces an `apk add openssl` that used to run inside
# `db`'s own entrypoint on first start (see docker-compose.split.yml's
# `db` comment for the full reasoning this replaced). That put a package-
# mirror network call in the critical boot path of the one service every
# other part of this deployment depends on; a slow or unreachable mirror
# at the wrong moment would crash-loop Postgres before it ever
# started, for a reason unrelated to Postgres or this deployment. Moved
# here instead: openssl is present on any stock Ubuntu image (no install
# needed), and this task runs before `db` ever starts for the first time,
# so by the time `docker compose up` runs below, a valid (if throwaway)
# cert/key pair already exists in the `db-tls` named volume.
#
# Ask `docker compose` itself for the resolved volume name rather than
# reconstructing compose's "<project>_<volume>" naming convention by
# hand — the project name is normally the compose-file directory's
# basename, but is overridable via COMPOSE_PROJECT_NAME/a `name:` key,
# and this must stay correct under either. `docker compose config
# --format json` resolves it the same way `docker compose up` itself
# will, so there is no risk of the two disagreeing.
- name: Resolve the db-tls volume's actual compose-qualified name
  ansible.builtin.shell: |
    set -o pipefail
    docker compose config --format json | python3 -c "import json,sys; print(json.load(sys.stdin)['volumes']['db-tls']['name'])"
  args:
    chdir: "{{ stack_dir }}"
    # Ubuntu's default /bin/sh is dash, which has no `set -o pipefail`.
    executable: /bin/bash
  changed_when: false
  register: compose_up_db_tls_volume_name

# `docker volume create` (idempotent — a no-op if it already exists) so
# the volume, and therefore a real host-side mountpoint to write into,
# exists even on a totally fresh deploy where `docker compose up` has
# never run at all yet.
- name: Ensure the db-tls named volume exists
  ansible.builtin.command: docker volume create {{ compose_up_db_tls_volume_name.stdout }}
  changed_when: false

- name: Find the db-tls volume's host-side mountpoint
  ansible.builtin.command: docker volume inspect --format '{{ '{{' }}.Mountpoint{{ '}}' }}' {{ compose_up_db_tls_volume_name.stdout }}
  changed_when: false
  register: compose_up_db_tls_mountpoint

- name: Check whether a TLS cert already exists in db-tls
  ansible.builtin.stat:
    path: "{{ compose_up_db_tls_mountpoint.stdout }}/server.crt"
  register: compose_up_existing_cert

# 7-day validity, matching the original bootstrap cert's intent: short
# enough that if the cert-reload role's own immediate post-deploy run
# (see roles/cert_reload/tasks/main.yml) is ever skipped or silently
# fails, this placeholder expires quickly and loudly rather than sitting
# unnoticed for a full 90-day Let's Encrypt cycle. Written directly with
# `openssl` on the control/target host (Ubuntu ships openssl by default;
# no apk, no container, no network dependency), then chowned to uid/gid
# 70 (postgres:16-alpine's fixed postgres uid — confirmed with
# `docker run --rm postgres:16-alpine id postgres`) so the container can
# read it without any in-container chown step.
- name: Generate a bootstrap placeholder TLS cert if none exists yet
  when: not compose_up_existing_cert.stat.exists
  block:
    - name: Generate the placeholder key + self-signed cert
      ansible.builtin.command: >-
        openssl req -x509 -newkey rsa:2048 -sha256 -days 7 -nodes
        -keyout {{ compose_up_db_tls_mountpoint.stdout }}/server.key
        -out {{ compose_up_db_tls_mountpoint.stdout }}/server.crt
        -subj /CN=announce-bootstrap-placeholder
      changed_when: true

    - name: Set ownership/permissions matching what Postgres requires
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "70"
        group: "70"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ compose_up_db_tls_mountpoint.stdout }}/server.crt", mode: "0644" }
        - { path: "{{ compose_up_db_tls_mountpoint.stdout }}/server.key", mode: "0600" }

# Pull the image-only services (db, signal, caddy). `build --pull` below
# refreshes only the base images of the two built services, and
# `up --no-build` never pulls an image that is already present, so without
# this step the floating tags (postgres:16-alpine,
# signal-cli-rest-api:latest, caddy:2-alpine) would keep running whatever
# was pulled on the first deploy. A new upstream digest makes `up` below
# recreate that container: a short db/caddy/signal restart is expected on
# such a run. Retries cover short registry faults; a lasting failure stops
# the deploy on purpose, because skipping the pull would skip the update.
- name: Pull current images for the image-only services
  ansible.builtin.command:
    cmd: docker compose pull --quiet --ignore-buildable
    chdir: "{{ stack_dir }}"
  register: compose_up_pull
  until: compose_up_pull.rc == 0
  retries: 3
  delay: 10
  changed_when: false

# Rebuild custom images from fresh package indexes before starting the stack.
# Run before handlers flush so the caddy handler can find its container.
- name: Build custom images with refreshed bases and CA bundles
  ansible.builtin.command:
    cmd: docker compose build --pull --no-cache
    chdir: "{{ stack_dir }}"
  changed_when: true

- name: Start / converge the stack
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans --no-build
    chdir: "{{ stack_dir }}"
  changed_when: true
