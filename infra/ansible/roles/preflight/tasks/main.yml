# Checks on the control machine (the operator's checkout) that must pass
# before the play changes anything on the host. This role is first in
# site.yml, so a failure here stops the play before the `docker` role
# installs packages or restarts Docker, and before `volume_mount` writes
# /etc/docker/daemon.json. Every task runs once, on the control machine
# (delegate_to: localhost, become: false: no sudo on the operator's
# machine), and changes nothing. The `command` tasks only read, so they set
# check_mode: false: under `ansible-playbook --check` they still run and
# the checks below see real results, not empty skipped ones. The
# registered results are used later by compose_up (the sync, the rsync
# filter template and DEPLOYED_COMMIT): a run_once task's result is set for
# every host of the play.

# The sync in compose_up needs GNU rsync 3.x on the control machine: it
# uses a merge filter file with `P` (protect) rules and --delete-excluded.
# macOS ships /usr/bin/rsync as openrsync ("openrsync: protocol version
# 29"), which was never tested with these options.
#
# Same binary as the sync: ansible.posix.synchronize runs the rsync named
# by the variable `ansible_rsync_path` when it is set (a path with a `/`
# is used as given), otherwise the first `rsync` on the PATH that
# ansible-playbook was started with. This task runs on the control
# machine with that same PATH, so it reads the same binary.
- name: Check that the control machine has GNU rsync 3.x
  ansible.builtin.command:
    argv: ["{{ ansible_rsync_path | default('rsync') }}", --version]
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  register: preflight_local_rsync

- name: Stop if the control machine's rsync is not GNU rsync 3.x
  ansible.builtin.assert:
    that:
      - preflight_local_rsync.rc == 0
      - preflight_local_rsync.stdout is match('rsync  version 3\.')
    fail_msg: >-
      This deploy needs GNU rsync 3.x on the machine that runs Ansible.
      Found: {{ (preflight_local_rsync.stdout_lines | default([]) | first | default(''))
      if preflight_local_rsync.rc == 0 else
      ('no rsync could run as "' ~ (ansible_rsync_path | default('rsync')) ~ '" ('
      ~ (preflight_local_rsync.msg | default('no output') | regex_replace('[.]+$', '')) ~ ')') }}.
      On macOS: brew install rsync, then open a new terminal so
      /opt/homebrew/bin comes first in PATH.
    quiet: true
  run_once: true

# `{{ playbook_dir }}/../..` is the repo root (site.yml lives in
# infra/ansible/).
- name: Find the repository root on the control machine
  ansible.builtin.set_fact:
    preflight_repo_root: "{{ (playbook_dir ~ '/../..') | realpath }}"

- name: Look for uncommitted changes to tracked files
  ansible.builtin.command:
    argv: [git, -C, "{{ preflight_repo_root }}", status, --porcelain, --untracked-files=no]
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  check_mode: false
  register: preflight_git_status

- name: Stop if tracked files have uncommitted changes
  ansible.builtin.fail:
    msg: >-
      Deploy stopped: these tracked files have changes that are not
      committed: {{ preflight_git_status.stdout_lines | join('; ') }}.
      The deploy ships the committed state of the repository only. Commit
      or discard the changes, then run the play again. To deploy the files
      as they are on disk anyway, add -e announce_allow_dirty_deploy=true;
      DEPLOYED_COMMIT on the host then records that the tree had local
      changes.
  when:
    - preflight_git_status.stdout | length > 0
    - not (announce_allow_dirty_deploy | default(false) | bool)
  run_once: true

- name: Read the commit being deployed
  ansible.builtin.command:
    argv: [git, -C, "{{ preflight_repo_root }}", rev-parse, HEAD]
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  check_mode: false
  register: preflight_git_head

# rc 0 and the branch name, or rc 1 on a detached HEAD.
- name: Read the branch being deployed
  ansible.builtin.command:
    argv: [git, -C, "{{ preflight_repo_root }}", symbolic-ref, --quiet, --short, HEAD]
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  register: preflight_git_branch

# "The current main" is `main` of the Foundation repository
# (AztecProtocol/announcement-tool), not whatever the local `main` tracks:
# in a checkout where `main` tracks a personal fork, `main@{upstream}` is
# the fork. The play finds the remote whose fetch URL points to the
# Foundation repository (preflight_foundation_url_regex in
# defaults/main.yml: https or ssh form, with or without `.git`, any case)
# and compares HEAD with `<that remote>/main` as git knows it now. No
# `git fetch` here: the play must not change the checkout, and must work
# offline. The ref is only as new as the last `git fetch`; DEPLOY.md's
# pre-flight fetches first.
- name: List the git remotes
  ansible.builtin.command:
    argv: [git, -C, "{{ preflight_repo_root }}", remote, -v]
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  check_mode: false
  register: preflight_git_remotes

# `git remote -v` prints "<name><TAB><url> (fetch)". With more than one
# Foundation remote, the first in git's order (by name) is used. A user
# name or token in an https URL is cut before the URL is printed or
# written to DEPLOYED_COMMIT.
- name: Find the remote that points to the Foundation repository
  ansible.builtin.set_fact:
    preflight_foundation_remote_lines: >-
      {{ preflight_git_remotes.stdout_lines
         | select('search', preflight_foundation_url_regex) | list }}
    preflight_remote_summary: >-
      {{ preflight_git_remotes.stdout_lines
         | select('search', ' \(fetch\)$')
         | map('regex_replace', '^([^\t]*)\t(.*) \(fetch\)$', '\1 = \2')
         | map('regex_replace', '//[^/@]*@', '//')
         | join('; ') | default('none', true) }}

- name: Record the Foundation remote
  ansible.builtin.set_fact:
    preflight_foundation_remote: >-
      {{ (preflight_foundation_remote_lines | first) | regex_replace('\t.*$', '')
         if preflight_foundation_remote_lines | length > 0 else '' }}
    preflight_foundation_url: >-
      {{ (preflight_foundation_remote_lines | first)
         | regex_replace('^[^\t]*\t(.*) \(fetch\)$', '\1')
         | regex_replace('//[^/@]*@', '//')
         if preflight_foundation_remote_lines | length > 0 else '' }}

- name: Read the commit of the Foundation main that git knows locally
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ preflight_repo_root }}"
      - rev-parse
      - --verify
      - --quiet
      - "refs/remotes/{{ preflight_foundation_remote }}/main^{commit}"
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  when: preflight_foundation_remote | length > 0
  register: preflight_git_main_head

- name: Record the branch name and the Foundation main
  ansible.builtin.set_fact:
    preflight_branch: "{{ preflight_git_branch.stdout if preflight_git_branch.rc == 0 else '(detached HEAD)' }}"
    preflight_main_ref: "{{ (preflight_foundation_remote ~ '/main') if preflight_foundation_remote | length > 0 else '' }}"
    preflight_main_commit: >-
      {{ preflight_git_main_head.stdout
         if (preflight_git_main_head.rc | default(1)) == 0 else '' }}

# A stop, with an override: deploying another commit on purpose (a
# hotfix, a rollback to an older commit) is allowed with
# -e announce_deploy_not_main=true. Each message names the fix commands
# with the real remote name.
- name: Compare the checkout with the Foundation main
  ansible.builtin.set_fact:
    preflight_main_problem: >-
      {{ ('No git remote points to AztecProtocol/announcement-tool (git remote -v: '
          ~ preflight_remote_summary ~ ').')
         if preflight_main_ref == '' else
         (('git knows no ' ~ preflight_main_ref ~ ' (' ~ preflight_foundation_url
           ~ '): that remote was never fetched, or has no main.')
          if preflight_main_commit == '' else
          (('HEAD ' ~ preflight_git_head.stdout[:12] ~ ' is not ' ~ preflight_main_ref
            ~ ' ' ~ preflight_main_commit[:12] ~ ' (as of the last git fetch).')
           if preflight_main_commit != preflight_git_head.stdout else '')) }}
    preflight_main_fix: >-
      {{ ('`git remote add foundation https://github.com/AztecProtocol/announcement-tool.git'
          ~ ' && git fetch foundation && git switch main && git merge --ff-only foundation/main`')
         if preflight_main_ref == '' else
         ('`git fetch ' ~ preflight_foundation_remote ~ ' && git switch main && git merge --ff-only '
          ~ preflight_main_ref ~ '` (or, to make main follow it for good: `git branch -u '
          ~ preflight_main_ref ~ ' main`, then `git pull --ff-only`)') }}

- name: Warn if the checkout may not be the current main
  ansible.builtin.debug:
    msg: >-
      WARNING: this deploy may not be the current main of
      AztecProtocol/announcement-tool. {{ preflight_main_problem }}
      If this is not on purpose, stop now (Ctrl-C), run
      {{ preflight_main_fix }}, and run the play again.
  when: preflight_main_problem | length > 0
  run_once: true

- name: Stop unless the checkout is the current main or the override is set
  ansible.builtin.fail:
    msg: >-
      Deploy stopped: this checkout is not the current main of
      AztecProtocol/announcement-tool. {{ preflight_main_problem }}
      To deploy main: run {{ preflight_main_fix }}, then run the play
      again. To deploy this commit on purpose (a hotfix, a rollback), add
      -e announce_deploy_not_main=true. Nothing was changed on the host.
  when:
    - preflight_main_problem | length > 0
    - not (announce_deploy_not_main | default(false) | bool)
  run_once: true

- name: List the tracked files
  ansible.builtin.command:
    argv: [git, -C, "{{ preflight_repo_root }}", -c, core.quotePath=false, ls-files]
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  check_mode: false
  register: preflight_git_files

# Even with core.quotePath=false, git prints a path in double quotes when
# it holds a double quote, a backslash or a control character. The rsync
# filter in compose_up cannot express those paths exactly, so the play
# stops.
#
# ansible.posix.synchronize adds rsync's `-F` (with its default
# delay_updates: true). `-F` reads every file named `.rsync-filter` in the
# source tree as more filter rules, so a tracked `.rsync-filter` could
# exclude or protect files on the host without anyone seeing it in the
# play. None is tracked; the play stops if one is.
- name: Refuse tracked paths the sync cannot ship exactly
  ansible.builtin.assert:
    that:
      - preflight_git_files.stdout_lines | length > 0
      - preflight_git_files.stdout_lines | select('match', '^"') | list | length == 0
      - preflight_git_files.stdout_lines | select('search', '(^|/)\.rsync-filter$') | list | length == 0
    fail_msg: >-
      git ls-files returned no files, a tracked path with a double quote,
      backslash or control character, or a tracked file named
      .rsync-filter ({{ preflight_git_files.stdout_lines | default([])
      | select('search', '(^|/)\.rsync-filter$') | join(', ') | default('none', true) }}).
      Rename or remove that file; the deploy cannot ship it exactly
      (rsync's -F would read a .rsync-filter as filter rules).
  run_once: true
