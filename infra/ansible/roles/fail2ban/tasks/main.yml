# Rate-limits repeated failed connection attempts against the publicly
# exposed Postgres port (5432). There is no tailnet on this deployment
# (infra/terraform/vm.tf) — Postgres is reachable from anywhere, TLS +
# the least-privilege `announce_app` role are what stop a stolen or
# guessed credential from doing damage, but neither stops a brute-force
# credential-stuffing run against the port itself. fail2ban is the layer
# that does.
#
# Postgres logs failed auth to its own stderr, which Docker sends to the
# json-file log driver by default — NOT to a host file fail2ban can tail
# directly. `docker logs` reads that json-file log, so this role wires up
# a small script that fail2ban's logpath calls through, rather than
# expecting Postgres to write directly to a host path (postgres:16-alpine
# has no such option without extra config, and duplicating Docker's
# logging pipeline is more moving parts than necessary).
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true

# `docker compose logs` needs a working directory; wrapping it in a script
# invoked with an absolute path keeps the jail's `logpath` simple (fail2ban
# does not expand shell variables in that field) and keeps stack_dir in one
# place (this file) instead of also baked into the jail.local template.
- name: Install the postgres-auth-log helper script
  ansible.builtin.template:
    src: pg-auth-log.sh.j2
    dest: /usr/local/bin/pg-auth-log.sh
    mode: "0755"

# Runs the helper once a minute via cron, appending new log lines to a real
# host file fail2ban can tail with `tail -F` semantics (its usual mode).
# fail2ban itself has no notion of "run a container log command on a
# timer" — this is the standard bridge pattern for containerized services
# whose logs otherwise only exist inside the Docker logging driver.
- name: Schedule the postgres-auth-log helper
  ansible.builtin.cron:
    name: "announce: mirror postgres auth log for fail2ban"
    minute: "*"
    job: /usr/local/bin/pg-auth-log.sh
    user: root

- name: Ensure the mirrored log file exists
  ansible.builtin.file:
    path: /var/log/announce-postgres-auth.log
    state: touch
    mode: "0644"
    access_time: preserve
    modification_time: preserve

- name: Install the postgres jail filter
  ansible.builtin.copy:
    dest: /etc/fail2ban/filter.d/announce-postgres.conf
    mode: "0644"
    content: |
      # Matches Postgres's own auth-failure log lines, as mirrored into
      # /var/log/announce-postgres-auth.log by pg-auth-log.sh.
      #
      # REWRITTEN after the original version was
      # proven, with a real postgres:16-alpine container, to never match
      # anything. That version assumed the client host appeared as a
      # trailing `client=<HOST>` (or similar) on the FATAL line — real
      # output has NO client address anywhere on any line under
      # Postgres's DEFAULT log_line_prefix ("%m [%p] "). A filter that
      # cannot match is worse than no filter, because it is believed.
      #
      # docker-compose.split.yml's `db.command` now sets
      # `log_line_prefix=%m [%p] %h ` (note the trailing space — also
      # load-bearing, see that file's comment: without it the IP runs
      # directly into "FATAL:" with no separator and this filter fails
      # to match, the exact same silent-jail failure mode this whole
      # change exists to fix) specifically so this filter has an IP to
      # bind <HOST> to. Verified directly against a real
      # container running that exact command: the client address appears
      # in ONE fixed position on every FATAL line — immediately after the
      # `[pid]` field, before the `FATAL:` keyword itself — for
      # password-authentication-failed, role-does-not-exist, and
      # database-does-not-exist cases alike (Postgres 16 folds "no such
      # role" into the same "password authentication failed" FATAL
      # wording as a wrong password, so a single pattern covers both
      # without needing a separate "role does not exist" alternative).
      # This is why the regex anchors on that fixed prefix position
      # rather than trying to match several different trailing message
      # shapes.
      #
      # NOTE: a connection over the Unix socket (used by tools running
      # ON this host, e.g. `docker compose exec db psql`) logs `[local]`
      # in the %h position instead of an IP. fail2ban's <HOST> only binds
      # to something it can parse as a real address/hostname, so a line
      # like that is matched by this regex but then silently skipped by
      # fail2ban itself rather than counted — correct behaviour, since a
      # Unix-socket connection did not come over the network and cannot
      # be IP-banned.
      [Definition]
      failregex = ^.*\[\d+\]\s+<HOST>\s+FATAL:\s
      ignoreregex =

- name: Install the postgres jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/announce-postgres.conf
    mode: "0644"
    content: |
      # Public Postgres port, no tailnet — see the note at the top of
      # roles/fail2ban/tasks/main.yml. 5 failures in 10 minutes bans the
      # source IP for 1 hour; deliberately more lenient than SSH-style
      # jails (findtime=10m, not 24h) because a legitimate client
      # (Netlify's shifting egress pool) can plausibly retry a handful of
      # times during a deploy without being a real attack, and a 1-hour
      # ban self-heals rather than requiring an operator to unban a
      # innocent IP by hand.
      [announce-postgres]
      enabled = true
      port = 5432
      protocol = tcp
      filter = announce-postgres
      logpath = /var/log/announce-postgres-auth.log
      maxretry = 5
      findtime = 10m
      bantime = 1h
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
