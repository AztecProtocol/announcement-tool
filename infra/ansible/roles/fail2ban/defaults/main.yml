# What the announce-postgres jail does when an address reaches five failed
# logins in ten minutes. Exactly one of:
#
#   watch  The jail runs as in `ban` mode (same filter, backend, maxretry,
#          findtime, bantime, ignoreip, usedns) but its action is fail2ban's
#          own `dummy`, which changes no firewall rule. fail2ban still
#          records each would-be ban: `fail2ban-client status
#          announce-postgres` lists the address under `Banned IP list:` and
#          /var/log/fail2ban.log has `NOTICE [announce-postgres] Ban <ip>`.
#          The port is NOT protected in this mode.
#   ban    The address is blocked from port 5432 for ten minutes, in this
#          jail's own nftables chain on the forward hook (f2b-announce-fwd).
#
# `watch` is the default so that a first deployment only records who the
# jail would ban. The application connects to this port from Netlify's
# shared egress addresses; switch to `ban` only after the would-be bans have
# been read for two weeks and none is the application's. How: infra/DEPLOY.md,
# "Before the first run with the live jail". Override in
# group_vars/all.yml (or with `-e announce_fail2ban_mode=ban`).
#
# tasks/main.yml stops the play on any other value.
announce_fail2ban_mode: watch
