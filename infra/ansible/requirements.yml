# Install with: ansible-galaxy collection install -r requirements.yml
#
# ansible.posix is needed for the `ansible.posix.synchronize` module
# (roles/compose_up/tasks/main.yml — rsyncs this repo onto the host).
# Everything else this playbook uses is ansible.builtin, part of
# ansible-core.
collections:
  - name: ansible.posix
    version: ">=1.5.0"
