# Split-deployment stack for the announcement tool's Hetzner VM.
#
# The app and worker run on Netlify, not on this VM. This VM runs only the
# stateful, host-bound pieces Netlify cannot: Postgres, signal-cli-rest-api
# (plus its keep-alive receive job), Caddy, and the nightly backup. There is
# no `app`, `worker`, or `migrate` service here, and no Node runtime on this
# VM at all: migrations and publisher-seeding are run from the operator's
# own machine, against the exposed Postgres port, using the app's own
# `npm run migrate` / `npm run seed:publisher` — not from this host, and not
# reimplemented as shell against this container. See infra/DEPLOY.md steps 6
# and 7. There is no tailnet here (see
# infra/terraform/vm.tf), by design — Postgres (5432) and Caddy (443) are
# exposed to the public internet, and TLS plus a least-privilege DB role
# plus fail2ban are what protect them, not network isolation. See
# infra/README.md for the `announce_app` role and infra/Caddyfile.split for
# the Signal proxy gate.
#
# The comments on `db`, `signal`, `signal-receive`, `backup`, and `caddy`
# below encode real incidents — signal-cli's silent send degradation, the
# backup crash-loop-vs-silent-abandonment reasoning — worth keeping in mind
# when touching those services.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: announce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: announce
    volumes:
      - db-data:/var/lib/postgresql/data
      # A separate volume from db-data, dedicated to TLS material. Not
      # Caddy's own cert directory: Caddy's ACME storage is owned by the
      # caddy container's uid and is not 0600-as-postgres, so Postgres could
      # not use it directly even read-only. Instead, this is where the
      # cert-reload Ansible role (and, on first deploy only, a one-time
      # Ansible bootstrap task — see the comment below) writes a cert/key
      # pair Postgres already owns and can read with the right mode. See
      # infra/ansible/roles/cert_reload/templates/cert-reload.sh.j2 for
      # how the ongoing copy happens and why it must, not can, run
      # outside this compose file.
      - db-tls:/var/lib/postgresql/tls
    # Bootstrap ordering note: `db-tls` starts empty on a fresh volume. The
    # cert-reload role (infra/ansible/roles/cert_reload) is what populates
    # it from Caddy's ACME-obtained cert, but that role's script itself
    # requires the `db` container to already be running (`docker compose
    # exec db ...`) to install a cert with the right ownership/mode. That's
    # a chicken-and-egg problem on first deploy: Postgres can't start
    # without a cert in db-tls/, and nothing can put a cert in db-tls/
    # until Postgres has started.
    #
    # This used to break the cycle with an `entrypoint` that
    # ran `apk add --no-cache openssl` on first start. That put a network
    # dependency in the critical boot path of the one service every other
    # part of this deployment depends on: if the Alpine package mirror is
    # slow, rate-limiting, or unreachable at the exact moment of first
    # deploy, `set -e` aborts the entrypoint and Postgres crash-loops
    # before ever starting, for a reason that has nothing to do with
    # Postgres, Docker, or this deployment's own config. This script's own
    # cert-reload comment (see cert-reload.sh.j2) already rejected an apk
    # dependency in its own logic for the same reason; that reasoning was
    # missed here on first pass and is now carried across consistently.
    #
    # The placeholder is instead generated by an Ansible task
    # (infra/ansible/roles/compose_up, "Generate a bootstrap placeholder
    # TLS cert if none exists yet") using the host's own openssl. That is
    # present on any stock Ubuntu image, so no package install is needed,
    # let alone one racing a first deploy. It is written directly into the
    # db-tls named volume's host-side mountpoint before `docker compose
    # up` ever runs `db` for the first time. By the time this container
    # starts, /var/lib/postgresql/tls already has a valid (if throwaway,
    # 7-day) cert/key pair, or the cert-reload role's real one if this is
    # not the first run. No entrypoint override is needed here — the stock
    # image's own entrypoint runs unmodified.
    # `ports:` publishes 5432 on the host's public interface. This is what
    # the split deployment needs, even though a single-host deployment where
    # app/worker reach `db:5432` over the private compose network would have
    # no need to publish this port at all. This is the split deployment:
    # Netlify's functions have no way to join a Docker network on this host, so
    # Postgres must be reachable over the public internet on 5432, from a
    # shifting pool of 80+ Netlify egress IPs with no stable range to
    # allowlist (see infra/terraform/vm.tf's firewall comment). What
    # protects this port, in the absence of a tailnet or IP allowlist, is:
    #   1. TLS with sslmode=verify-full enforced client-side (src/db/
    #      connect.ts refuses "require" — encrypted-but-unverified — and
    #      refuses to start without DATABASE_SSL_ROOT_CERT). See the
    #      cert-reload note above for how the serving cert stays current.
    #   2. The `announce_app` role (migrations/014_app_role.sql,
    #      infra/README.md): least-privilege, no DROP/TRUNCATE/ALTER, no
    #      DELETE on the two append-only audit tables. A leaked credential
    #      cannot do catastrophic damage.
    #   3. fail2ban on this host (infra/ansible/roles/fail2ban), rate-
    #      limiting repeated failed connection attempts against 5432 —
    #      without a tailnet, an unthrottled public Postgres port is a
    #      brute-force target.
    # None of these is optional; removing any one weakens the others'
    # justification for this port being open at all.
    #
    # Host port is DB_HOST_PORT, defaulting to the real 5432. It is
    # overridable only so a local verification run can avoid colliding with
    # the unrelated announce-db-1 / announce-db-tls-1 containers this
    # repo's test suite already runs on this machine. A real deployment
    # should never set DB_HOST_PORT; Netlify's DATABASE_URL expects 5432.
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    command:
      # Same rationale as docker-compose.dev.yml's `db-tls` service: the
      # cert/key arrive on a bind mount owned by the host user (or, here,
      # by whatever uid the cert-reload role wrote them as), never uid 70
      # (postgres in this image), so they cannot be pointed at directly.
      # `command` overrides the entrypoint's default `postgres` invocation
      # to add ssl flags; the base image's own entrypoint still handles
      # initdb / permission-drop before exec'ing this.
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      # log_line_prefix with %h (client host address) matters for
      # infra/ansible/roles/fail2ban's jail. It is not a cosmetic logging
      # preference. Verified directly against a real postgres:16-alpine
      # container: Postgres's default prefix ("%m [%p] ") never includes
      # the client address on any line, including FATAL auth-failure
      # lines. A real failed login produces `2026-08-30 12:50:03.363 UTC
      # [41753] FATAL:  password authentication failed for user
      # "announce"` with no IP anywhere on that line or the DETAIL line
      # beneath it. A fail2ban filter written against a `client=<HOST>`
      # suffix (or any other assumed trailing format) matches nothing
      # against the real default output — the jail installs, shows as
      # enabled, and never fires. With %h added, the client address
      # appears in a fixed position right after the pid on every line,
      # including FATAL ones: `... [pid] <client-ip> FATAL: ...` —
      # confirmed against real password-authentication-failed,
      # role-does-not-exist, and database-does-not-exist cases, which
      # (also confirmed) all share this exact shape rather than three
      # different trailing formats.
      #
      # The trailing space matters too (caught during verification, not
      # on first pass): a YAML list-item scalar does not strip a trailing
      # space the way it would look stripped on the page, but Postgres's
      # `-c key=value` parsing takes the value literally. Without a
      # trailing space after %h, the client IP runs directly into
      # "FATAL:" with no separator at all (confirmed:
      # `172.22.0.1FATAL:  password authentication failed...`), which the
      # fail2ban filter below (anchored on `<HOST>\s+FATAL:`) then fails
      # to match, silently — the same "jail never fires" failure mode
      # this whole log_line_prefix change exists to fix. The explicit
      # quoted value below keeps the trailing space unambiguous in the
      # compose file itself rather than relying on an invisible
      # end-of-line character surviving edits.
      - -c
      - "log_line_prefix=%m [%p] %h "
    healthcheck:
      # `pg_isready` alone races a freshly-started
      # container that accepts TCP before it can actually serve. Nothing
      # in this compose file depends on this healthcheck (there is no
      # `migrate` service here to gate on it), but it stays because it is
      # cheap, correct, and useful for `docker compose ps` / monitoring.
      test: ["CMD-SHELL", "pg_isready -U announce -d announce"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      # Caps Docker's json-file log driver, which is uncapped by
      # default. This matters more for `db` than any other
      # service here: two separate scripts scan its full log on a
      # recurring basis —
      # infra/ansible/roles/fail2ban/templates/pg-auth-log.sh.j2 does
      # `docker compose logs db | wc -l` every minute, and
      # infra/ansible/roles/cert_reload/templates/cert-reload.sh.j2 reads
      # it after every SIGHUP. `--since` (used by the cert-reload script)
      # limits what is printed, not what Docker has to scan to get
      # there, so an uncapped log file means both of those get slower,
      # without bound, over the life of a long-running deployment.
      # 3 files x 10MB caps this service's log at ~30MB on disk while
      # keeping enough history for the fail2ban mirror (which runs every
      # minute) and cert-reload (which runs daily) to never miss a
      # rotation boundary they can't already handle. Both scripts
      # already have explicit rotation-handling logic (see
      # pg-auth-log.sh.j2's comment on JSON-file log rotation), so this
      # cap does not introduce a new failure mode, only bounds an
      # existing unbounded one.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  signal:
    image: bbernhard/signal-cli-rest-api:latest
    restart: unless-stopped
    environment:
      MODE: native
    volumes:
      - signal-data:/home/.local/share/signal-cli
    # Not published to the host directly. Caddy (below) does need to reach
    # it, but Caddy does so over the compose network as `signal:8080`, same
    # as any other service-to-service call. Nothing needs a host port here;
    # the public path is Caddy's 443, gated by the shared secret (see
    # infra/Caddyfile.split).

  signal-receive:
    # Periodic `GET /v1/receive/{number}` against the signal service. This
    # is required, not optional housekeeping: signal-cli warns that an
    # account which only ever sends and never receives degrades, and
    # outbound sending then silently stops working. There is no error at
    # send time — `/v2/send` keeps returning 201, but messages simply stop
    # arriving. Hit live 2026-08-11; see scripts/signal-receive.sh and the
    # README's Signal registration notes.
    #
    # Built from Dockerfile.signal-receive, not the app's own Dockerfile:
    # this job only needs bash + curl, and the app's `node:22-alpine`
    # runtime image ships neither. Same reasoning as the `backup` service
    # below and Dockerfile.backup.
    build:
      context: ..
      dockerfile: Dockerfile.signal-receive
    restart: unless-stopped
    depends_on:
      - signal
    environment:
      SIGNAL_API_BASE: http://signal:8080
      # Deliberately NOT `${SIGNAL_ACCOUNT:?...}`. Compose interpolates
      # every service's `environment:` block up front, before starting
      # anything, and `:?` fails on empty as well as unset — so a `:?`
      # here does not just stop `signal-receive`, it aborts `docker
      # compose up` for the whole file, including `db`, `caddy` and
      # `backup`, none of which read this variable at all. Verified
      # directly: with `SIGNAL_ACCOUNT=` (empty, not unset) and `:?`
      # in place, `docker compose up` exits before creating a single
      # container. Signal is deliberately unconfigured until a number is
      # registered (see infra/DEPLOY.md step 3), so that abort would
      # trigger on every fresh deploy, not just a misconfigured one.
      # `:-` substitutes an empty string instead, which lets Compose's
      # interpolation pass succeed for every service. The emptiness is
      # then handled at runtime, scoped to this one container: the
      # entrypoint below checks for it and fails only `signal-receive`,
      # which is the one service that actually cannot do anything
      # without an account. `db`, `caddy` and `backup` are unaffected
      # either way, since none of them reference SIGNAL_ACCOUNT.
      SIGNAL_ACCOUNT: ${SIGNAL_ACCOUNT:-}
    # Same sleep-loop-plus-entrypoint scheduling shape as the `backup`
    # service below, at a much shorter period: this only needs to run often
    # enough that signal-cli's server-side sees regular activity, not once
    # a night. Every SIGNAL_RECEIVE_INTERVAL_SECONDS (default 6 hours), run
    # signal-receive.sh once. If the script itself fails (account
    # unreachable, non-2xx), the entrypoint's `set -e` propagates that exit,
    # `restart: unless-stopped` restarts the container, and it goes straight
    # back to polling on schedule — same crash-loop-vs-silent-abandonment
    # reasoning as the backup service. `entrypoint:` here overrides the
    # image's own ENTRYPOINT (a single direct run of the script, used when
    # invoking the container image standalone) with this loop.
    #
    # The explicit `if [ -z ... ]` below is what actually enforces
    # "SIGNAL_ACCOUNT must be set" for this container now that the
    # `environment:` line above no longer does. It restart-loops on an
    # empty account, same as `:?` would have, but confined to this one
    # service instead of the whole stack.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$SIGNAL_ACCOUNT" ]; then
          echo "SIGNAL_ACCOUNT is not set. Signal is not configured on" \
               "this deployment yet; this container will restart until" \
               "a Signal number is registered and SIGNAL_ACCOUNT is set" \
               "in /opt/announce/.env. See infra/DEPLOY.md step 3." >&2
          exit 1
        fi
        interval="${SIGNAL_RECEIVE_INTERVAL_SECONDS:-21600}"
        while true; do
          /usr/local/bin/signal-receive.sh
          sleep "$$interval"
        done

  caddy:
    # Public-facing TLS terminator for this deployment. See
    # infra/Caddyfile.split for what it actually serves: it only obtains
    # and renews the Let's Encrypt cert for db.announce.aztec.network, and
    # reverse-proxies to signal:8080 behind a shared-secret gate. It does
    # not front the public site — Netlify serves that — and there is no
    # admin-404 guard here.
    #
    # There is no `app` container on this host at all, so this Caddy does
    # not share an app's network namespace. It joins the default compose
    # network directly and gets its own `ports:` mapping.
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - signal
    # Host ports are CADDY_HTTPS_PORT (default 443), same override
    # rationale as DB_HOST_PORT above, for the same local-verification
    # reason. No 80 mapping: HTTP-01 ACME challenges and any plain-HTTP
    # visitor are handled by Caddy's automatic HTTPS redirect, which needs
    # only 443 for TLS-ALPN-01 in this setup. If HTTP-01 is ever required
    # instead, add "80:80" here and to the firewall in vm.tf.
    ports:
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp" # HTTP/3 (QUIC)
    environment:
      ANNOUNCE_DOMAIN: ${ANNOUNCE_DOMAIN:?ANNOUNCE_DOMAIN must be set}
      # Read by infra/Caddyfile.split's shared-secret gate. Must match
      # SIGNAL_API_SECRET as configured on the Netlify side (the app's
      # SIGNAL_API_SECRET env var, sent by src/core/signal-auth.ts as the
      # x-announce-signal-secret header). This is the "proxy" half of the
      # fail-closed pair described there.
      #
      # This uses `:?`, not a silent sentinel fallback. The first version
      # of this line used `${ANNOUNCE_SIGNAL_SECRET:-<sentinel>}` so
      # Caddy's own `header` matcher never saw a syntactically empty
      # argument, which crash-loops the container (Caddy's own
      # `{$VAR:default}` placeholder only fires on a truly unset variable,
      # not a present-but-empty one, so it could not rescue that case by
      # itself — see infra/Caddyfile.split for that finding in full). That
      # design worked, but it was the odd one out among every other secret
      # in this file: POSTGRES_PASSWORD, BACKUP_ENCRYPTION_KEY, and
      # ANNOUNCE_DOMAIN all fail the whole stack loudly with `:?` the
      # moment they're unset, rather than quietly substituting a
      # placeholder and continuing. `:?` here does the same: an unset
      # ANNOUNCE_SIGNAL_SECRET now refuses to bring `caddy` up at all
      # ("ANNOUNCE_SIGNAL_SECRET must be set"), which is a louder, earlier
      # failure than either the old sentinel-substitution or a live 403 —
      # an operator who forgot this var finds out at `docker compose up`
      # time, not by testing the Signal proxy later. This also removes the
      # published-sentinel property entirely: there is no longer any magic
      # string an unset-secret deployment answers to, because an unset
      # secret now means the container never starts. The Caddyfile's own
      # `{$ANNOUNCE_SIGNAL_SECRET:...}` default now only covers the one
      # remaining case where it is still needed: this Caddyfile run by
      # hand, outside this compose file entirely.
      #
      # SIGNAL_ACCOUNT is the deliberate exception to this "fail the
      # whole stack loudly" list. It uses `:-` (see the `signal-receive`
      # service below), not `:?`, because Compose validates every
      # service's `:?` interpolation before starting anything — so a
      # `:?` on SIGNAL_ACCOUNT would abort `db`, `caddy` and `backup`
      # too, even though none of them read it, for as long as Signal
      # stays deliberately unconfigured (no number registered yet). The
      # loud, early failure this comment argues for above is still
      # correct for a secret every deployment needs from day one; it is
      # the wrong behavior for a value that is expected to be empty on
      # a fresh deploy.
      ANNOUNCE_SIGNAL_SECRET: ${ANNOUNCE_SIGNAL_SECRET:?ANNOUNCE_SIGNAL_SECRET must be set}
    volumes:
      - ./Caddyfile.split:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    # Nightly dump + encrypt + restore-verify + off-host upload. See
    # scripts/backup.sh for the full spec and comments — this service just
    # wires it into compose and a schedule.
    #
    # Built from Dockerfile.backup, not the app's own Dockerfile: this job
    # needs pg_dump/pg_restore/psql (postgres:16-alpine already has them),
    # plus gnupg (encryption) and aws-cli (S3-compatible upload) that the
    # app image has no reason to carry. Using a separate file rather than
    # compose's `dockerfile_inline` is a deliberate choice — see the note
    # at the top of Dockerfile.backup for why inline silently builds the
    # wrong image when the buildx plugin is absent.
    build:
      context: ..
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: announce
      PGDATABASE: announce
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Symmetric passphrase the dump is encrypted with before it ever
      # leaves this container — see scripts/backup.sh. Required; there is
      # no default, because a default would mean every deployment that
      # forgets to set it encrypts backups with a known key.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY must be set}
      # S3-compatible destination, off this VM. BACKUP_S3_ENDPOINT is only
      # needed for a non-AWS S3-compatible provider (e.g. Backblaze B2,
      # MinIO, Hetzner Object Storage); leave unset for real AWS S3.
      #
      # These three (BACKUP_S3_BUCKET, and the two credential vars below)
      # are deliberately NOT `:?`, unlike BACKUP_ENCRYPTION_KEY above and
      # POSTGRES_PASSWORD/ANNOUNCE_DOMAIN/ANNOUNCE_SIGNAL_SECRET elsewhere
      # in this file. Same reasoning as SIGNAL_ACCOUNT on the
      # `signal-receive` service: Compose validates every service's `:?`
      # interpolation before starting anything, so `:?` on any of these
      # would abort `db`, `caddy` and `signal` too, over variables none of
      # them read. An operator standing up this VM for the first time may
      # not have an S3 bucket and keys ready yet — that is a real,
      # temporary, acceptable state, the same as not having a Signal
      # number yet. A VM that will not boot at all is not acceptable.
      # `backup`'s own entrypoint (below) checks these explicitly and
      # exits before ever calling scripts/backup.sh, so the failure is
      # loud and immediate but confined to this one container.
      #
      # BACKUP_ENCRYPTION_KEY above stays `:?` on purpose — it is not in
      # this group. An empty S3 bucket/credentials means "no backup runs
      # yet," which is safe. An empty encryption key would risk "a backup
      # runs and uploads this database's data — including subscriber
      # emails — to off-host storage unencrypted," which is worse than no
      # backup at all. There is no safe degraded state for that one, so it
      # keeps failing the whole stack loudly rather than confining the
      # failure to `backup`.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-announce-backups}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-30}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-12}
      # Same alert destination and ESP as channel-health alerts (see
      # src/core/alerts.ts / ALERT_EMAIL_TO) — a failed or missing backup
      # raises an alert on the same path, not a separate one.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ESP_PROVIDER: ${ESP_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SIGNAL_DATA_DIR: /signal-data
    volumes:
      # Read-only: the signal-cli data directory is backed up, never
      # written to, from this container.
      - signal-data:/signal-data:ro
    # This container runs the full nightly job once and exits — it is not a
    # long-lived daemon. `entrypoint: ["sh", "-c", ...]` with a sleep-loop
    # is how it gets scheduling without a host cron dependency: it sleeps
    # until the next 03:00 UTC, runs backup.sh, and loops. `restart:
    # unless-stopped` means if backup.sh itself exits non-zero (a real
    # failure, not just "waiting for the next run"), Docker restarts the
    # container and it goes straight back to sleeping for the next window.
    # A crash-looping backup container is not the same as a silently
    # abandoned one, and the alert already fired inside backup.sh's own
    # failure path before this loop ever restarts it.
    #
    # The explicit check below, before the sleep-until-03:00 loop, is what
    # actually enforces "BACKUP_S3_BUCKET / AWS_ACCESS_KEY_ID /
    # AWS_SECRET_ACCESS_KEY must be set" for this container now that the
    # `environment:` block above no longer does via `:?`. scripts/backup.sh
    # itself already guards BACKUP_S3_BUCKET (line 47) and would fail on
    # missing AWS credentials via aws-cli's own auth error — but only once
    # it actually *runs*, which without this check could be up to 24 hours
    # after `docker compose up`, on an S3-unconfigured deployment that
    # looks perfectly healthy (`Up`) the whole time until it silently
    # crash-loops at 03:00 with no operator watching. Checking at container
    # start instead surfaces the same "S3 not configured yet" state
    # immediately, the same way signal-receive's start-time check does.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$BACKUP_S3_BUCKET" ] || [ -z "$$AWS_ACCESS_KEY_ID" ] || [ -z "$$AWS_SECRET_ACCESS_KEY" ]; then
          echo "BACKUP_S3_BUCKET / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY" \
               "are not all set. Off-host backup is not configured on this" \
               "deployment yet; this container will restart until they are" \
               "set in /opt/announce/.env. See infra/DEPLOY.md step 3. The" \
               "database itself is unaffected — this only blocks backups." >&2
          exit 1
        fi
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d '03:00' +%s)
          if [ "$$next" -le "$$now" ]; then next=$$((next + 86400)); fi
          sleep $$((next - now))
          /usr/local/bin/backup.sh
        done

volumes:
  db-data:
  db-tls:
  signal-data:
  caddy-data:
  caddy-config:
