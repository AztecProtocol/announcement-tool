# Client authentication rules for the split deployment's Postgres
# (infra/docker-compose.split.yml, service `db`). The db command points
# Postgres at this file with `-c hba_file=/etc/postgresql/announce/pg_hba.conf`;
# the copy inside the data volume (the image's stock file) is no longer read.
#
# Postgres checks the lines from the top and uses the FIRST line whose
# connection type, database, user and address match. If no line matches, the
# login is refused and Postgres logs `no pg_hba.conf entry for host ...`.
#
# What each line is for:
#
#   local / 127.0.0.1 / ::1 trust
#       Connections from inside the db container only: `docker compose exec
#       db psql -U announce` (socket), the image entrypoint's first-start
#       init (socket), and cert-reload.sh.j2's live TLS check (TCP to
#       127.0.0.1 inside the container). A published-port connection never
#       arrives from 127.0.0.1: Docker hands it to the container from the
#       network gateway or the real client address.
#
#   hostssl ... announce samenet
#       The owner `announce` over TLS from the compose network's subnet.
#       The `backup` container (scripts/backup.sh, including CREATE/DROP
#       DATABASE for the restore check) needs it. It is wider than that:
#       it matches EVERY service of the compose project (also the
#       internet-facing `caddy` and the unused `signal`), and, because
#       Docker masquerades a connection to the published port from another
#       bridge or from the host, any container on any Docker network on
#       the VM and any process on the host (127.0.0.1 arrives as the
#       gateway, 172.x.0.1). All of these are on the VM, and each still
#       needs the owner password. Narrowing it to the backup container's
#       fixed address is a possible later step (docs/SECURITY-PROPERTIES.md,
#       P44).
#
#       It also carries most owner logins from the tailnet: Tailscale's
#       default netfilter mode on the VM can masquerade traffic it forwards
#       from the tailnet, and Docker then hands the connection to Postgres
#       from the bridge gateway, not from the 100.x address. Which one
#       Postgres sees depends on the order of the VM's netfilter rules.
#
#   hostssl ... announce 100.64.0.0/10
#       The owner `announce` over TLS from a tailnet address (Tailscale's
#       range), when the 100.x source survives to Postgres. It may often go
#       unused: the `samenet` line above carries the logins that arrive
#       from the gateway. Owner scripts (`npm run migrate`,
#       `npm run seed:publisher`, psql as the owner) run from an operator
#       machine on the tailnet. See infra/DEPLOY.md, "Run owner commands
#       over the tailnet".
#
#   hostssl announce announce_app 0.0.0.0/0
#       The application role from anywhere, TLS only: Netlify's functions
#       connect from a changing pool of public addresses.
#
# Everything else is refused: a plaintext login of any role, and the owner
# `announce` from any public address. The owner is the image bootstrap
# superuser and cannot be demoted, so it must not be reachable from the
# internet at all.
#
# Do NOT add a final `host all all all reject` line. With it, Postgres logs
# `pg_hba.conf rejects connection for host ...`, which the fail2ban filter
# (infra/ansible/roles/fail2ban/tasks/main.yml) does not count. Without it,
# the refusal logs `no pg_hba.conf entry for host ...`, which the filter
# counts. The result for the client is the same.
#
# Do NOT publish 5432 on IPv6 (see the `ports:` comment on `db`). Over IPv6
# Docker's proxy replaces the client address with the network gateway, which
# matches `samenet` and would let the owner in from the internet.
#
# After a change to this file: the next Ansible run copies it to the VM, but
# Postgres reads it only at start and on a reload. Reload on the VM with
#   docker compose -f /opt/announce/docker-compose.yml exec db \
#     psql -U announce -d announce -c 'select pg_reload_conf()'
# then check that it parsed:
#   ... -c 'select line_number, error from pg_hba_file_rules where error is not null'
# (no rows = no error). The file is mounted as a directory, not as a single
# file, so the container sees the new copy without a restart.

# TYPE  DATABASE  USER          ADDRESS         METHOD
local   all       all                           trust
host    all       all           127.0.0.1/32    trust
host    all       all           ::1/128         trust
hostssl all       announce      samenet         scram-sha-256
hostssl all       announce      100.64.0.0/10   scram-sha-256
hostssl announce  announce_app  0.0.0.0/0       scram-sha-256
