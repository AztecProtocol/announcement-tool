<!doctype html>
<!-- Source of public/brand/og-site.png (1200 x 630). Laid out at 600 x 315 CSS px,
     rendered at device scale 2. Command: see scripts/brand-images/README.md. -->
<html lang="en"><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 600px; height: 315px; overflow: hidden; background: #141900; }
  .card { box-sizing: border-box; width: 600px; height: 315px; padding: 38px 42px;
          display: flex; flex-direction: column; justify-content: space-between; }
  .mark { width: 164px; height: 38px; display: block; }
  .text { display: flex; flex-direction: column; gap: 10px; }
  .title { font-family: Georgia, "C059", "Times New Roman", serif; font-size: 36px; line-height: 1.15; color: #fff9f2; }
  .sub { font-family: ui-sans-serif, system-ui, "DejaVu Sans", sans-serif; font-size: 16px; color: #b6b8b0; }
  .bar { width: 67px; height: 4px; background: #c8fa00; }
</style></head><body><div class="card">
  <img class="mark" src="../../public/brand/aztec-wordmark-paper.svg" alt="">
  <div class="text">
    <span class="title">Network announcements</span>
    <span class="sub">Upgrades, governance and incidents for Aztec operators</span>
  </div>
  <div class="bar"></div>
</div></body></html>
